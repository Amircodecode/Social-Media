[project]
name = "social-media"
version = "0.1.0"
description = "Social Media API"
authors = [{ name = "Amir" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "asyncpg",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt==4.0.1",
    "python-multipart",
    "fastapi-mail",
    "itsdangerous",
    "celery>=5.6.3",
    "redis>=8.1.0",
    "python-dotenv>=1.2.2",
    "pydantic[email]>=2.13.4",
    "alembic>=1.20.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "black",
    "flake8",
    "pre-commit>=4.6.2",
]

[tool.uv]
package = false

[tool.black]
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

